plugins {
    id("java")
}

group = "org.example"
version = "1.0-SNAPSHOT"

repositories {
    mavenCentral()
}
ext {
    junitVersion = "5.11.4"
    assertJVersion = "3.26.3"
    restAssuredVersion = "5.5.0"
    jacksonCoreVersion = "2.17.2"
    lombokVersion = "1.18.34"
    allureVersion = "2.28.0"
    logVersion = "2.23.1"
    //awaitilityVersion = "4.2.0"
}
// подключение зависимостей
dependencies {
    // тест движок junit
    testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-params:${junitVersion}"
// rest-assured - для тестирования api
    implementation "io.rest-assured:rest-assured:${restAssuredVersion}"
// jackson - библиотека для взаимодействия с джэйсон файлами, внутри рест ажурда есть функции для работы с джэйсонами, которых не достаточно-джэксон исправляет это
    implementation "com.fasterxml.jackson.core:jackson-core:${jacksonCoreVersion}"
    implementation "com.fasterxml.jackson.core:jackson-annotations:${jacksonCoreVersion}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonCoreVersion}"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonCoreVersion}"
//
    testImplementation "io.qameta.allure:allure-junit5:${allureVersion}"
    testImplementation "io.qameta.allure:allure-rest-assured:${allureVersion}"
// lombok
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    implementation platform("org.apache.logging.log4j:log4j-bom:${logVersion}")
    implementation "org.apache.logging.log4j:log4j-api"
    implementation "org.apache.logging.log4j:log4j-core"
    implementation "org.apache.logging.log4j:log4j-slf4j2-impl"

    //testImplementation "org.awaitility:awaitility:${awaitilityVersion}"

    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testImplementation "org.assertj:assertj-core:${assertJVersion}"
}

test {
    useJUnitPlatform()
    }